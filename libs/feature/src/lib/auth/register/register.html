<div nz-flex [nzVertical]="true" [nzGap]="16">
    <h1>{{ 'register.register.title' | transloco }}</h1>
    
    <form nz-flex [nzVertical]="true" [nzGap]="16" [formRoot]="registerForm">
        <div nz-flex [nzVertical]="true" [nzGap]="8">
            <span>{{ 'register.register.name' | transloco }}</span>
            <input nz-input [formField]="registerForm.name"/>
        </div>
        <div nz-flex [nzVertical]="true" [nzGap]="8">
            <span>{{ 'register.register.email' | transloco }}</span>
            <input nz-input [formField]="registerForm.email"/>
        </div>
        <div nz-flex [nzVertical]="true" [nzGap]="8">
            <span>{{ 'register.register.password' | transloco }}</span>
            <input nz-input type="password" [formField]="registerForm.password"/>
        </div>
        
        <button nz-button nzType="primary" type="submit" [disabled]="registerForm().invalid()">{{ 'register.register.submit' | transloco }}</button>
    </form>
</div>
